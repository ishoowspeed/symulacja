<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Komunikator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #login-screen {
    background: #1e293b;
    padding: 40px;
    border-radius: 16px;
    text-align: center;
    width: 320px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  #login-screen h1 { margin-top: 0; font-size: 22px; }
  #nick-input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    margin: 16px 0;
    font-size: 16px;
    background: #334155;
    color: #fff;
  }
  #join-btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #6366f1;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }
  #join-btn:hover { background: #4f46e5; }

  #chat-screen {
    display: none;
    width: 100%;
    max-width: 700px;
    height: 90vh;
    background: #1e293b;
    border-radius: 16px;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  #chat-header {
    padding: 16px 20px;
    background: #6366f1;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #chat-header h2 { margin: 0; font-size: 18px; }
  #users-count { font-size: 13px; opacity: 0.9; }

  #messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 12px;
    background: #334155;
    word-wrap: break-word;
  }
  .msg.own {
    background: #6366f1;
    align-self: flex-end;
  }
  .msg .nick {
    font-size: 12px;
    font-weight: bold;
    opacity: 0.8;
    display: block;
    margin-bottom: 3px;
  }
  .msg .time {
    font-size: 10px;
    opacity: 0.6;
    display: block;
    margin-top: 4px;
    text-align: right;
  }
  .system-msg {
    text-align: center;
    font-size: 12px;
    opacity: 0.6;
    font-style: italic;
  }
  #typing-indicator {
    font-size: 12px;
    opacity: 0.6;
    padding: 0 16px 6px;
    height: 16px;
  }

  #input-area {
    display: flex;
    padding: 12px;
    background: #0f172a;
    gap: 8px;
  }
  #msg-input {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: #334155;
    color: white;
    font-size: 15px;
  }
  #send-btn {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: #6366f1;
    color: white;
    cursor: pointer;
    font-size: 15px;
  }
  #send-btn:hover { background: #4f46e5; }
</style>
</head>
<body>

<!-- Ekran czatu -->
<div id="chat-screen" style="display:flex;">
  <div id="chat-header">
    <h2>💬 Mini Komunikator</h2>
    <span id="users-count">0 online</span>
  </div>
  <div id="messages"></div>
  <div id="typing-indicator"></div>
  <div id="input-area">
    <input id="msg-input" type="text" placeholder="Napisz wiadomość..." />
    <button id="send-btn">Wyślij</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  // Bez zapisanego nicku wracamy do ekranu logowania
  const myNick = localStorage.getItem('komunikator_nick');
  if (!myNick) {
    window.location.href = 'index.html';
  }

  const socket = io();

  const messagesEl = document.getElementById('messages');
  const msgInput = document.getElementById('msg-input');
  const sendBtn = document.getElementById('send-btn');
  const usersCount = document.getElementById('users-count');
  const typingIndicator = document.getElementById('typing-indicator');

  socket.emit('join', myNick);
  msgInput.focus();

  function addMessage({ nick, text, time }) {
    const div = document.createElement('div');
    div.className = 'msg' + (nick === myNick ? ' own' : '');
    div.innerHTML = `<span class="nick">${escapeHtml(nick)}</span>${escapeHtml(text)}<span class="time">${time}</span>`;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addSystemMessage(text) {
    const div = document.createElement('div');
    div.className = 'system-msg';
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function sendMessage() {
    const text = msgInput.value.trim();
    if (!text) return;
    socket.emit('message', text);
    msgInput.value = '';
  }

  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

  let typingTimeout;
  msgInput.addEventListener('input', () => {
    socket.emit('typing');
  });

  socket.on('message', addMessage);
  socket.on('system', addSystemMessage);
  socket.on('users', (list) => {
    usersCount.textContent = `${list.length} online`;
  });
  socket.on('typing', (nick) => {
    typingIndicator.textContent = `${nick} pisze...`;
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => { typingIndicator.textContent = ''; }, 1500);
  });
</script>

</body>
</html>
