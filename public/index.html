<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Czat Online</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-container">
    
    <!-- Ekran logowania -->
    <div id="login-screen" class="card">
      <div class="login-header">
        <i class="fa-solid fa-comments logo-icon"></i>
        <h2>Witaj w Czacie</h2>
        <p>Wprowadź swój pseudonim, aby dołączyć do dyskusji</p>
      </div>
      <form id="login-form">
        <input type="text" id="username-input" placeholder="Twoja nazwa / pseudonim..." required maxlength="20" autocomplete="off">
        <button type="submit" class="btn primary"><i class="fa-solid fa-right-to-bracket"></i> Dołącz do czatu</button>
      </form>
    </div>

    <!-- Główny interfejs czatu -->
    <div id="chat-screen" class="chat-container hidden">
      <!-- Pasek boczny / nagłówek -->
      <header class="chat-header">
        <div class="user-info">
          <div class="avatar" id="user-avatar">U</div>
          <div>
            <h3 id="display-username">Użytkownik</h3>
            <span class="status-online"><i class="fa-solid fa-circle"></i> Dostępny</span>
          </div>
        </div>

        <div class="header-actions">
          <!-- Czerwone kółko z powiadomieniami (widoczne TYLKO po zalogowaniu) -->
          <div id="notification-badge" class="notification-badge hidden" title="Nieprzeczytane wiadomości">
            <i class="fa-solid fa-bell"></i>
            <span id="unread-count" class="badge-count">0</span>
          </div>

          <button id="logout-btn" class="btn danger-outline" title="Wyloguj się">
            <i class="fa-solid fa-power-off"></i> Wyloguj
          </button>
        </div>
      </header>

      <!-- Obszar wiadomości -->
      <div class="chat-messages" id="messages-container">
        <!-- Wiadomości będą dodawane dynamicznie -->
      </div>

      <!-- Formularz wysyłania wiadomości -->
      <form id="message-form" class="chat-input-area">
        <input type="text" id="message-input" placeholder="Napisz wiadomość..." autocomplete="off">
        <button type="submit" class="btn primary send-btn"><i class="fa-solid fa-paper-plane"></i></button>
      </form>
    </div>

  </div>

  <!-- Modal do edycji wiadomości -->
  <div id="edit-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Edytuj wiadomość</h3>
      <input type="text" id="edit-input" maxlength="500">
      <div class="modal-actions">
        <button id="cancel-edit-btn" class="btn secondary">Anuluj</button>
        <button id="save-edit-btn" class="btn primary">Zapisz zmiany</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
