<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikacja Czat</title>
  <!-- Material Symbols z Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background-color: #1e1f29; color: #f2f3f5; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }

    /* EKRAN AUTORYZACJI */
    .auth-container { background: #2b2d3f; padding: 2.5rem; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.6); width: 100%; max-width: 420px; border: 1px solid #47326e; text-align: center; }
    .auth-container h2 { color: #ffffff; font-size: 1.6rem; margin-bottom: 1.5rem; }
    .tabs { display: flex; margin-bottom: 1.5rem; border-bottom: 2px solid #3b3d54; }
    .tab { flex: 1; padding: 0.75rem; cursor: pointer; color: #949ba4; font-weight: 600; }
    .tab.active { color: #a855f7; border-bottom: 2px solid #a855f7; margin-bottom: -2px; }
    .form-group { margin-bottom: 1.25rem; text-align: left; }
    label { display: block; margin-bottom: 0.5rem; color: #b9bbbe; font-size: 0.85rem; font-weight: bold; text-transform: uppercase; }
    input, select { width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #1e1f29; background: #1e1f29; color: white; font-size: 1rem; }
    input:focus, select:focus { outline: none; border-color: #a855f7; }
    button.auth-btn { width: 100%; padding: 0.8rem; border-radius: 6px; border: none; background: #8b5cf6; color: white; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button.auth-btn:hover { background: #7c3aed; }
    #message { margin-top: 1rem; padding: 0.75rem; border-radius: 6px; font-size: 0.9rem; display: none; }
    .success { background: #15803d; color: #4ade80; }
    .error { background: #991b1b; color: #fca5a5; }

    /* EKRAN GŁÓWNY CZATU */
    #app-container { display: none; width: 100vw; height: 100vh; flex-direction: row; }
    .sidebar-servers { width: 72px; background-color: #13131a; display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 8px; border-right: 1px solid #2b2d3f; }
    .server-icon { width: 48px; height: 48px; background-color: #2b2d3f; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #a855f7; font-weight: bold; cursor: pointer; transition: all 0.2s; font-size: 1.2rem; }
    .server-icon:hover, .server-icon.active { background-color: #8b5cf6; color: white; border-radius: 16px; }

    .sidebar-channels { width: 240px; background-color: #1e1f29; display: flex; flex-direction: column; border-right: 1px solid #2b2d3f; }
    .server-header { padding: 16px; font-weight: bold; color: white; border-bottom: 1px solid #2b2d3f; font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center; }
    .channels-list { padding: 10px 8px; flex: 1; }
    .channel-item { padding: 8px 12px; border-radius: 6px; color: #949ba4; cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 500; }
    .channel-item:hover, .channel-item.active { background-color: #2b2d3f; color: #f2f3f5; }

    .user-panel { padding: 12px; background-color: #13131a; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #2b2d3f; }
    .user-info { display: flex; align-items: center; gap: 8px; overflow: hidden; }
    .avatar-wrapper { position: relative; display: inline-block; }
    .avatar { width: 36px; height: 36px; background-color: #8b5cf6; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1rem; }
    .status-dot { position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #13131a; }
    .status-Online { background-color: #22c55e; }
    .status-Offline { background-color: #64748b; }
    .status-Nie-przeszkadzać { background-color: #ef4444; }

    .user-details { display: flex; flex-direction: column; }
    .username-text { font-weight: bold; font-size: 0.9rem; color: #f2f3f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px; }
    .status-text { font-size: 0.75rem; color: #949ba4; }

    .panel-actions { display: flex; gap: 6px; align-items: center; }
    .icon-btn { background: none; border: none; color: #949ba4; cursor: pointer; padding: 4px; border-radius: 4px; display: flex; align-items: center; justify-content: center; transition: color 0.2s, background 0.2s; }
    .icon-btn:hover { color: #f2f3f5; background-color: #2b2d3f; }
    .icon-btn.logout:hover { color: #fca5a5; }

    .chat-area { flex: 1; background-color: #2b2d3f; display: flex; flex-direction: column; }
    .chat-header { height: 50px; border-bottom: 1px solid #1e1f29; display: flex; align-items: center; padding: 0 16px; font-weight: bold; gap: 8px; color: white; }
    .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message-item { display: flex; gap: 12px; }
    .message-avatar { width: 40px; height: 40px; background-color: #7c3aed; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; flex-shrink: 0; }
    .message-content-box { display: flex; flex-direction: column; }
    .message-author { font-weight: bold; color: #c084fc; font-size: 0.95rem; margin-bottom: 2px; }
    .message-time { font-size: 0.75rem; color: #949ba4; font-weight: normal; margin-left: 8px; }
    .message-text { color: #dcddde; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }

    .chat-input-area { padding: 16px; background-color: #2b2d3f; }
    .chat-input-wrapper { background-color: #1e1f29; border-radius: 8px; padding: 0 12px; display: flex; align-items: center; border: 1px solid #47326e; }
    .chat-input { width: 100%; padding: 12px 0; background: transparent; border: none; color: white; font-size: 1rem; }
    .chat-input:focus { outline: none; }
    .send-btn { background: #8b5cf6; border: none; color: white; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-left: 8px; }
    .send-btn:hover { background: #7c3aed; }

    /* OKNO MODALNE USTAWIEŃ */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.7); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #2b2d3f; padding: 2rem; border-radius: 12px; border: 1px solid #47326e; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .modal-header h3 { color: #ffffff; font-size: 1.3rem; }
    .modal-close { background: none; border: none; color: #949ba4; cursor: pointer; font-size: 1.5rem; display: flex; align-items: center; }
    .modal-close:hover { color: #ffffff; }
    .modal-actions { display: flex; gap: 10px; margin-top: 1.5rem; }
    .btn-secondary { background: #475569; border: none; color: white; padding: 0.75rem; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; }
    .btn-secondary:hover { background: #334155; }
    #settings-message { margin-top: 1rem; padding: 0.5rem; border-radius: 4px; font-size: 0.85rem; text-align: center; display: none; }
  </style>
</head>
<body>

  <!-- EKRAN AUTORYZACJI -->
  <div class="auth-container" id="auth-box">
    <h2 id="auth-title">Witaj ponownie!</h2>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('login')">Logowanie</div>
      <div class="tab" onclick="switchTab('register')">Rejestracja</div>
    </div>

    <form onsubmit="handleSubmit(event)">
      <div class="form-group">
        <label>Nazwa użytkownika</label>
        <input type="text" id="username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Hasło</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="auth-btn" id="submit-btn">Zaloguj się</button>
    </form>

    <div id="message"></div>
  </div>

  <!-- EKRAN GŁÓWNY CZATU -->
  <div id="app-container">
    <!-- Kolumna Serwerów -->
    <div class="sidebar-servers">
      <div class="server-icon active">T</div>
      <div class="server-icon">+</div>
    </div>

    <!-- Kolumna Kanałów -->
    <div class="sidebar-channels">
      <div class="server-header">
        <span>Test</span>
      </div>
      <div class="channels-list">
        <div class="channel-item active">
          <span style="font-size: 1.2rem; color: #a855f7;">#</span> ogólny
        </div>
        <div class="channel-item">
          <span style="font-size: 1.2rem; color: #949ba4;">#</span> rozmowy
        </div>
      </div>

      <!-- Panel Użytkownika -->
      <div class="user-panel">
        <div class="user-info">
          <div class="avatar-wrapper">
            <div class="avatar" id="user-avatar">U</div>
            <div class="status-dot status-Online" id="status-dot"></div>
          </div>
          <div class="user-details">
            <span class="username-text" id="logged-username">Użytkownik</span>
            <span class="status-text" id="logged-status">Online</span>
          </div>
        </div>
        
        <div class="panel-actions">
          <!-- Ikona Ustawień (Google Fonts) -->
          <button class="icon-btn" onclick="openSettingsModal()" title="Ustawienia">
            <span class="material-symbols-outlined">settings</span>
          </button>
          <!-- Ikona Wyloguj (Google Fonts) -->
          <button class="icon-btn logout" onclick="logout()" title="Wyloguj">
            <span class="material-symbols-outlined">logout</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Główny Czat -->
    <div class="chat-area">
      <div class="chat-header">
        <span style="font-size: 1.4rem; color: #a855f7;">#</span>
        <span>ogólny</span>
      </div>

      <div class="chat-messages" id="messages-container"></div>

      <div class="chat-input-area">
        <form onsubmit="sendMessage(event)">
          <div class="chat-input-wrapper">
            <input type="text" class="chat-input" id="message-input" placeholder="Napisz wiadomość..." autocomplete="off">
            <button type="submit" class="send-btn">Wyślij</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- OKNO MODALNE USTAWIEŃ -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Ustawienia konta</h3>
        <button class="modal-close" onclick="closeSettingsModal()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <form onsubmit="handleSettingsSave(event)">
        <div class="form-group">
          <label>Nowa nazwa użytkownika</label>
          <input type="text" id="settings-username" placeholder="Pozostaw puste, aby nie zmieniać">
        </div>

        <div class="form-group">
          <label>Nowe hasło</label>
          <input type="password" id="settings-password" placeholder="Pozostaw puste, aby nie zmieniać">
        </div>

        <div class="form-group">
          <label>Status</label>
          <select id="settings-status">
            <option value="Online">Online</option>
            <option value="Offline">Offline</option>
            <option value="Nie przeszkadzać">Nie przeszkadzać</option>
          </select>
        </div>

        <div id="settings-message"></div>

        <div class="modal-actions">
          <button type="button" class="btn-secondary" onclick="closeSettingsModal()">Anuluj</button>
          <button type="submit" class="auth-btn" style="flex:1;">Zapisz</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let mode = 'login';
    let currentUser = null;
    let ws = null;

    function switchTab(newMode) {
      mode = newMode;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      const tabs = document.querySelectorAll('.tab');
      
      if (mode === 'login') {
        tabs[0].classList.add('active');
        document.getElementById('auth-title').innerText = 'Witaj ponownie!';
        document.getElementById('submit-btn').innerText = 'Zaloguj się';
      } else {
        tabs[1].classList.add('active');
        document.getElementById('auth-title').innerText = 'Stwórz konto';
        document.getElementById('submit-btn').innerText = 'Zarejestruj się';
      }
      hideMessage();
    }

    function showMessage(text, isError = false) {
      const msgBox = document.getElementById('message');
      msgBox.innerText = text;
      msgBox.className = isError ? 'error' : 'success';
      msgBox.style.display = 'block';
    }

    function hideMessage() {
      document.getElementById('message').style.display = 'none';
    }

    async function handleSubmit(event) {
      event.preventDefault();
      hideMessage();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const endpoint = mode === 'register' ? '/api/register' : '/api/login';

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          if (mode === 'register') {
            showMessage(data.message + ' Możesz się teraz zalogować.');
            switchTab('login');
          } else {
            currentUser = data.user;
            enterChatApp();
          }
        } else {
          showMessage(data.message || 'Wystąpił błąd', true);
        }
      } catch (err) {
        showMessage('Brak połączenia z serwerem.', true);
      }
    }

    async function enterChatApp() {
      document.getElementById('auth-box').style.display = 'none';
      const appContainer = document.getElementById('app-container');
      appContainer.style.display = 'flex';

      updateUserUI();

      await loadMessageHistory();
      connectWebSocket();
    }

    function updateUserUI() {
      document.getElementById('logged-username').innerText = currentUser.username;
      document.getElementById('user-avatar').innerText = currentUser.username.charAt(0).toUpperCase();
      
      const status = currentUser.status || 'Online';
      document.getElementById('logged-status').innerText = status;

      const dot = document.getElementById('status-dot');
      dot.className = 'status-dot status-' + status.replace(/\s+/g, '-');
    }

    async function loadMessageHistory() {
      try {
        const res = await fetch('/api/messages');
        const data = await res.json();
        if (data.success) {
          const container = document.getElementById('messages-container');
          container.innerHTML = '';
          data.messages.forEach(msg => appendMessageUI(msg));
          scrollToBottom();
        }
      } catch (err) {
        console.error('Błąd pobierania historii:', err);
      }
    }

    function connectWebSocket() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${window.location.host}`);

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === 'new_message') {
          appendMessageUI(data.message);
          scrollToBottom();
        }
      };

      ws.onclose = () => {
        setTimeout(connectWebSocket, 3000);
      };
    }

    function appendMessageUI(msg) {
      const container = document.getElementById('messages-container');
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message-item';

      const initial = msg.username ? msg.username.charAt(0).toUpperCase() : '?';
      const timeStr = msg.created_at ? new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

      msgDiv.innerHTML = `
        <div class="message-avatar">${initial}</div>
        <div class="message-content-box">
          <div>
            <span class="message-author">${msg.username}</span>
            <span class="message-time">${timeStr}</span>
          </div>
          <div class="message-text">${escapeHtml(msg.content)}</div>
        </div>
      `;

      container.appendChild(msgDiv);
    }

    function sendMessage(event) {
      event.preventDefault();
      const input = document.getElementById('message-input');
      const content = input.value.trim();

      if (content && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'message',
          username: currentUser.username,
          content: content
        }));
        input.value = '';
      }
    }

    function scrollToBottom() {
      const container = document.getElementById('messages-container');
      container.scrollTop = container.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    /* USTAWIENIA USTAWIEŃ I MODALA */
    function openSettingsModal() {
      document.getElementById('settings-username').value = '';
      document.getElementById('settings-password').value = '';
      document.getElementById('settings-status').value = currentUser.status || 'Online';
      document.getElementById('settings-message').style.display = 'none';
      document.getElementById('settings-modal').style.display = 'flex';
    }

    function closeSettingsModal() {
      document.getElementById('settings-modal').style.display = 'none';
    }

    async function handleSettingsSave(event) {
      event.preventDefault();
      const newUsername = document.getElementById('settings-username').value;
      const newPassword = document.getElementById('settings-password').value;
      const newStatus = document.getElementById('settings-status').value;
      const msgBox = document.getElementById('settings-message');

      try {
        const response = await fetch('/api/update-profile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: currentUser.id,
            newUsername,
            newPassword,
            newStatus
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          currentUser = data.user;
          updateUserUI();
          msgBox.innerText = 'Zapisano!';
          msgBox.className = 'success';
          msgBox.style.display = 'block';
          setTimeout(() => {
            closeSettingsModal();
          }, 1000);
        } else {
          msgBox.innerText = data.message || 'Błąd zapisu';
          msgBox.className = 'error';
          msgBox.style.display = 'block';
        }
      } catch (err) {
        msgBox.innerText = 'Błąd połączenia.';
        msgBox.className = 'error';
        msgBox.style.display = 'block';
      }
    }

    function logout() {
      if (ws) ws.close();
      document.getElementById('app-container').style.display = 'none';
      document.getElementById('auth-box').style.display = 'block';
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      hideMessage();
      switchTab('login');
    }
  </script>
</body>
</html>
