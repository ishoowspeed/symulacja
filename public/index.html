<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELITE</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Main Chat Area (Channels sidebar removed as requested) -->
        <main class="chat-main">
            <!-- Top Header -->
            <header class="chat-header">
                <div class="header-left">
                    <div class="brand-logo">
                        <i class="fa-solid fa-crown"></i>
                    </div>
                    <div class="title-container">
                        <h1 class="app-title">ELITE</h1>
                        <div class="status-badge">
                            <span class="status-dot"></span>
                            <span class="status-text">ELITE ACTIVE</span>
                        </div>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" title="Powiadomienia"><i class="fa-regular fa-bell"></i></button>
                    <button class="icon-btn" title="Ustawienia"><i class="fa-solid fa-gear"></i></button>
                    <div class="user-profile">
                        <div class="avatar">E</div>
                        <span class="username">Użytkownik</span>
                    </div>
                </div>
            </header>

            <!-- Chat Messages Window -->
            <section class="messages-container" id="messagesContainer">
                <div class="system-message">
                    <span class="system-badge"><i class="fa-solid fa-shield-halved"></i> Witamy w ELITE</span>
                    <p>Połączenie szyfrowane end-to-end ustanowione.</p>
                </div>

                <div class="message incoming">
                    <div class="msg-avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="msg-content-wrapper">
                        <div class="msg-author">System ELITE <span class="badge-elite">ELITE</span></div>
                        <div class="msg-bubble">
                            Witaj w aplikacji <strong>ELITE</strong>! Panele boczne zostały usunięte, a nagłówek zaktualizowany zgodnie z wytycznymi.
                        </div>
                        <div class="msg-time">12:00</div>
                    </div>
                </div>
            </section>

            <!-- Message Input Area -->
            <footer class="chat-input-area">
                <form id="chatForm" onsubmit="sendMessage(event)">
                    <div class="input-wrapper">
                        <button type="button" class="action-btn" title="Załącznik"><i class="fa-solid fa-paperclip"></i></button>
                        <input type="text" id="messageInput" placeholder="Napisz wiadomość w ELITE..." autocomplete="off" required>
                        <button type="button" class="action-btn" title="Emoji"><i class="fa-regular fa-face-smile"></i></button>
                        <button type="submit" class="send-btn" title="Wyślij">
                            <span>Wyślij</span>
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </form>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
